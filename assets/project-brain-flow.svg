<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Snipara Project Brain connections</title>
  <desc id="desc">Claude Code, Codex, Cursor, Gemini CLI and Windsurf connect to the Snipara Project Brain, which returns code, decisions, memory and changes.</desc>
  <defs>
    <linearGradient id="brain" x1="420" y1="72" x2="780" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#45D6B5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="1192" height="352" rx="28" fill="#0E1726"/>
  <g fill="none" stroke="#6E7E9D" stroke-width="2" opacity=".72">
    <path d="M250 74C340 74 350 124 420 140"/>
    <path d="M250 133C340 133 350 150 420 160"/>
    <path d="M250 192H420"/>
    <path d="M250 251C340 251 350 210 420 200"/>
    <path d="M250 310C340 310 350 226 420 220"/>
    <path d="M780 180h170"/>
  </g>
  <g fill="#A9B7D2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="650">
    <text x="52" y="82">Claude Code</text>
    <text x="52" y="141">Codex</text>
    <text x="52" y="200">Cursor</text>
    <text x="52" y="259">Gemini CLI</text>
    <text x="52" y="318">Windsurf</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="72" width="360" height="216" rx="28" fill="url(#brain)"/>
    <circle cx="600" cy="142" r="26" fill="#F8FAFC" opacity=".96"/>
    <path d="M600 111v62M569 142h62M578 120l44 44M622 120l-44 44" stroke="#0E1726" stroke-width="5" stroke-linecap="round" opacity=".86"/>
    <text x="600" y="214" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="30" font-weight="750">Snipara Project Brain</text>
    <text x="600" y="251" text-anchor="middle" fill="#E4E9F3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="550">shared context for every agent</text>
  </g>
  <g fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="21" font-weight="650">
    <text x="980" y="136">Code</text>
    <text x="980" y="174">Decisions</text>
    <text x="980" y="212">Memory</text>
    <text x="980" y="250">Changes</text>
  </g>
  <path d="M934 180h28" stroke="#68E5C7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="934" cy="180" r="5" fill="#68E5C7"/>
</svg>
