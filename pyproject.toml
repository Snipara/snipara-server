[project]
name = "snipara-server"
version = "1.9.0"
description = "Self-hosted MCP server for Snipara project memory and context optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Functional Source License 1.1, Apache-2.0 future license" }
authors = [{ name = "Snipara" }]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "prisma>=0.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.2.2",
    "bcrypt>=4.1.0",
    "tiktoken>=0.5.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pypdf>=5.1.0",
    "sentry-sdk[fastapi]>=1.40.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "mcp>=1.25.0",
    "openai>=1.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pdoc>=15.0.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
override-dependencies = [
    "Pygments>=2.20.0",
    "requests>=2.33.1",
    "transformers>=5.5.4",
    "python-multipart>=0.0.27",
]

[tool.mypy]
python_version = "3.11"
strict = true
