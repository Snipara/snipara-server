name: Release Snipara Server

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic-version tag to release"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: snipara-server-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/snipara/snipara-server

jobs:
  validate:
    name: Validate exact release source
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.source.outputs.release_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - id: source
        name: Validate semantic-version tag
        run: |
          set -euo pipefail
          release_ref="${{ inputs.tag || github.ref_name }}"
          printf '%s' "$release_ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and release tools
        run: python -m pip install --upgrade pip build twine
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run release checks
        run: |
          ruff check src tests
          python -m compileall -q src scripts
          pytest -q
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: snipara-server-${{ steps.source.outputs.release_ref }}-python
          path: dist/*
          if-no-files-found: error

  image:
    name: Publish immutable GHCR image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_ref }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.release_ref }}
            type=raw,value=stable
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-cloud:
    name: Notify private Cloud consumer
    needs: [validate, image]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned release payload
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLOUD_RELEASE_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "alopez3006",
              repo: "snipara-webapp",
              event_type: "snipara-server-release",
              client_payload: {
                source_repository: "${{ github.repository }}",
                source_ref: "${{ needs.validate.outputs.release_ref }}",
                source_sha: "${{ needs.validate.outputs.source_sha }}",
                image: "${{ env.IMAGE }}",
                image_digest: "${{ needs.image.outputs.digest }}",
                compatibility: "snipara-server-oss-v2",
                release_url: "https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.release_ref }}"
              }
            });
