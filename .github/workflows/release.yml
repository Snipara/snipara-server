name: Release Snipara Server

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic-version tag to release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: snipara-server-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/snipara/snipara-server

jobs:
  validate:
    name: Validate exact release source
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.source.outputs.release_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: source
        name: Validate semantic-version tag
        env:
          RELEASE_REF_INPUT: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_ref="$RELEASE_REF_INPUT"
          printf '%s' "$release_ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(git describe --tags --exact-match HEAD)" = "$release_ref"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package and release tools
        run: python -m pip install --upgrade pip build twine
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run release checks
        run: |
          ruff check src tests
          python -m compileall -q src scripts
          python scripts/verify_oss_boundary.py
          pytest -q
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snipara-server-${{ steps.source.outputs.release_ref }}-python
          path: dist/*
          if-no-files-found: error

  image:
    name: Publish immutable GHCR image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.release_ref }}
            type=raw,value=stable
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-cloud:
    name: Notify private Cloud consumer
    needs: [validate, image]
    if: ${{ vars.CLOUD_RELEASE_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require explicit dispatch configuration
        env:
          DISPATCH_TOKEN: ${{ secrets.CLOUD_RELEASE_DISPATCH_TOKEN }}
        run: test -n "$DISPATCH_TOKEN"
      - name: Dispatch pinned release payload
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ needs.validate.outputs.release_ref }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          IMAGE: ${{ env.IMAGE }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        with:
          github-token: ${{ secrets.CLOUD_RELEASE_DISPATCH_TOKEN }}
          script: |
            const sourceRepository = process.env.SOURCE_REPOSITORY;
            const sourceRef = process.env.SOURCE_REF;
            const sourceSha = process.env.SOURCE_SHA;
            const image = process.env.IMAGE;
            const imageDigest = process.env.IMAGE_DIGEST;
            if (sourceRepository !== "Snipara/snipara-server") {
              throw new Error(`Unexpected source repository: ${sourceRepository}`);
            }
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(sourceRef)) {
              throw new Error(`Unexpected source ref: ${sourceRef}`);
            }
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              throw new Error("Unexpected source SHA");
            }
            if (image !== "ghcr.io/snipara/snipara-server") {
              throw new Error(`Unexpected image: ${image}`);
            }
            if (!/^sha256:[0-9a-f]{64}$/.test(imageDigest)) {
              throw new Error("Unexpected image digest");
            }
            await github.rest.repos.createDispatchEvent({
              owner: "alopez3006",
              repo: "snipara-webapp",
              event_type: "snipara-server-release",
              client_payload: {
                source_repository: sourceRepository,
                source_ref: sourceRef,
                source_sha: sourceSha,
                image,
                image_digest: imageDigest,
                compatibility: "snipara-server-oss-v2",
                release_url: `https://github.com/${sourceRepository}/releases/tag/${sourceRef}`
              }
            });
